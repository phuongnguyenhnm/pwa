<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dịch Thông Minh</title>
  <style>
    :root {
      --bg: #131314;
      --surface: #1e1f20;
      --surface-2: #282a2c;
      --surface-3: #333537;
      --border: #3c4043;
      --text: #e3e3e3;
      --text-muted: #9aa0a6;
      --accent: #a8c7fa;
      --accent-dark: #004a77;
      --accent-bg: #0b3954;
      --danger: #f28b82;
      --danger-bg: #3c1618;
      --success: #81c995;
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app-shell {
      width: 100%;
      max-width: 680px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 12px 16px 20px;
      gap: 12px;
    }

    /* Top Bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 2px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      transition: background 0.15s, border-color 0.15s;
      position: relative;
    }

    .icon-btn:hover {
      background: var(--surface-2);
    }

    .brand-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 500;
      letter-spacing: -0.2px;
      color: var(--text);
    }

    .sub-pill {
      font-size: 11.5px;
      color: var(--text-muted);
      background: var(--surface-2);
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }

    .key-dot {
      position: absolute;
      top: 7px;
      right: 7px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
    }

    .key-dot.ready {
      background: var(--success);
    }

    /* Error Banner */
    .error-box {
      display: none;
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid rgba(242, 139, 130, 0.35);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 13px;
      line-height: 1.45;
    }

    /* Main Input Card */
    .input-card {
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: var(--radius-lg);
      padding: 16px;
      min-height: 225px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }

    .input-top-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      flex: 1;
    }

    textarea#sourceText {
      width: 100%;
      min-height: 120px;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      color: var(--text);
      font-size: 20px;
      line-height: 1.45;
    }

    textarea#sourceText::placeholder {
      color: var(--text-muted);
      font-weight: 400;
    }

    .draw-trigger-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 17px;
      transition: background 0.15s, color 0.15s;
    }

    .draw-trigger-btn:hover,
    .draw-trigger-btn.active {
      background: var(--accent-bg);
      color: var(--accent);
    }

    /* Canvas Sub-panel */
    .canvas-panel {
      display: none;
      flex-direction: column;
      gap: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px;
    }

    .canvas-stage {
      width: 100%;
      height: 185px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: #111213;
      border: 1px dashed var(--border);
      touch-action: none;
    }

    canvas#drawCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }

    .canvas-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Image Sub-panel */
    .image-panel {
      display: none;
      flex-direction: column;
      gap: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px;
    }

    .image-preview-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 120px;
      max-height: 210px;
      border-radius: var(--radius-sm);
      background: #111213;
      overflow: hidden;
      padding: 6px;
    }

    img#imagePreview {
      max-width: 100%;
      max-height: 195px;
      border-radius: 8px;
      object-fit: contain;
    }

    /* Input Footer Row */
    .input-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .left-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chip-btn {
      background: var(--accent-bg);
      color: var(--accent);
      border: none;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: filter 0.15s;
    }

    .chip-btn:hover {
      filter: brightness(1.12);
    }

    .ghost-btn {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.15s;
    }

    .ghost-btn:hover {
      background: var(--surface-3);
    }

    .primary-pill-btn {
      background: var(--accent);
      color: #062e6f;
      border: none;
      border-radius: 999px;
      padding: 9px 18px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: opacity 0.15s, transform 0.1s;
    }

    .primary-pill-btn:hover {
      opacity: 0.92;
    }

    .primary-pill-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* Result Card */
    .result-card {
      display: none;
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-lg);
      padding: 18px;
      flex-direction: column;
      gap: 14px;
    }

    .result-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .result-main-text {
      font-size: 22px;
      font-weight: 600;
      line-height: 1.4;
      color: #ffffff;
      word-break: break-word;
    }

    .phonetic-badge {
      display: inline-block;
      margin-top: 6px;
      background: var(--accent-bg);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 500;
    }

    .note-box {
      background: var(--surface-2);
      border-radius: var(--radius-sm);
      padding: 11px 13px;
      font-size: 13.5px;
      line-height: 1.5;
      color: var(--text);
      border-left: 3px solid var(--accent);
    }

    .examples-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .examples-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .example-card {
      background: var(--surface-2);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .ex-sentence {
      font-size: 14.5px;
      font-weight: 500;
      color: var(--text);
    }

    .ex-phonetic {
      font-size: 12.5px;
      color: var(--accent);
    }

    .ex-meaning {
      font-size: 13px;
      color: var(--text-muted);
    }

    .result-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      flex-wrap: wrap;
    }

    /* Live Conversation Sheet */
    .live-card {
      display: none;
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-lg);
      padding: 16px;
      flex-direction: column;
      gap: 12px;
    }

    .live-feed {
      min-height: 180px;
      max-height: 310px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 10px;
      background: var(--bg);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
    }

    .bubble {
      max-width: 84%;
      padding: 10px 13px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.45;
    }

    .bubble-a {
      align-self: flex-start;
      background: var(--surface-2);
      color: var(--text);
    }

    .bubble-b {
      align-self: flex-end;
      background: var(--accent-bg);
      color: #ffffff;
    }

    .bubble-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .live-turn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .turn-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius-md);
      padding: 11px 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 13px;
      transition: background 0.15s, border-color 0.15s;
    }

    .turn-btn.active {
      background: var(--danger-bg);
      border-color: var(--danger);
      color: var(--danger);
    }

    .turn-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Bottom Dock */
    .bottom-dock {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding-top: 8px;
    }

    .lang-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
    }

    .lang-pill {
      width: 100%;
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: var(--radius-md);
      padding: 13px 14px;
      font-size: 15px;
      font-weight: 500;
      text-align: center;
      text-align-last: center;
      outline: none;
      cursor: pointer;
      appearance: none;
    }

    .swap-icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 18px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }

    .swap-icon-btn:hover {
      background: var(--surface-2);
      color: var(--text);
    }

    .action-dock {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      justify-items: center;
      padding-bottom: 6px;
    }

    .dock-side {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      background: transparent;
      border: none;
      color: var(--text);
    }

    .dock-small-circle {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #004a77;
      color: #c2e7ff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      transition: transform 0.12s, filter 0.15s;
    }

    .dock-side:hover .dock-small-circle {
      filter: brightness(1.12);
    }

    .dock-side.active .dock-small-circle {
      background: var(--danger);
      color: #ffffff;
    }

    .dock-label {
      font-size: 12.5px;
      color: var(--text);
      font-weight: 400;
    }

    .mic-fab {
      width: 78px;
      height: 78px;
      border-radius: 26px;
      background: var(--accent);
      color: #062e6f;
      border: none;
      font-size: 28px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
      transition: transform 0.15s, background 0.2s, color 0.2s;
    }

    .mic-fab:hover {
      transform: scale(1.03);
    }

    .mic-fab.recording {
      background: var(--danger);
      color: #ffffff;
      border-radius: 50%;
      animation: pulseRing 1.25s infinite;
    }

    @keyframes pulseRing {
      0% { box-shadow: 0 0 0 0 rgba(242, 139, 130, 0.45); }
      70% { box-shadow: 0 0 0 16px rgba(242, 139, 130, 0); }
      100% { box-shadow: 0 0 0 0 rgba(242, 139, 130, 0); }
    }

    .spinner {
      width: 15px;
      height: 15px;
      border: 2px solid rgba(6, 46, 111, 0.25);
      border-top-color: #062e6f;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Modal */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-card {
      width: 100%;
      max-width: 440px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      color: var(--text);
    }

    .modal-card h3 {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .modal-card p {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 14px;
    }

    .modal-card a {
      color: var(--accent);
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      font-size: 12.5px;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .field input,
    .field select {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--accent);
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Top Bar -->
    <header class="topbar">
      <button class="icon-btn" id="clearAllBtn" title="Làm mới nội dung">↺</button>

      <div class="brand-center">
        <div class="brand-title">Dịch Thông Minh</div>
        <div class="sub-pill" id="statusPill">Sẵn sàng • Gemini</div>
      </div>

      <button class="icon-btn" id="openKeyBtn" title="Cài đặt API Key & Model">
        <span>⚙️</span>
        <span class="key-dot" id="keyDot"></span>
      </button>
    </header>

    <!-- Error Alert -->
    <div class="error-box" id="errorBox"></div>

    <!-- Input Card -->
    <section class="input-card">
      <div class="input-top-row">
        <textarea
          id="sourceText"
          placeholder="Nhập văn bản cần dịch..."
          rows="4"
        ></textarea>

        <button class="draw-trigger-btn" id="toggleDrawBtn" title="Vẽ nét chữ để nhận diện & dịch">
          ✍️
        </button>
      </div>

      <!-- Canvas Draw Sub-panel -->
      <div class="canvas-panel" id="canvasPanel">
        <div class="canvas-stage">
          <canvas id="drawCanvas"></canvas>
        </div>
        <div class="canvas-controls">
          <div style="display:flex; gap:6px; align-items:center;">
            <button class="ghost-btn" id="undoDrawBtn" type="button">↩ Hoàn tác</button>
            <button class="ghost-btn" id="clearDrawBtn" type="button">Xóa</button>
            <select id="brushSize" class="ghost-btn" aria-label="Độ dày nét">
              <option value="3">Mảnh</option>
              <option value="6" selected>Vừa</option>
              <option value="10">Đậm</option>
            </select>
          </div>
          <button class="primary-pill-btn" id="translateDrawBtn" type="button">
            <span>Dịch nét vẽ</span>
            <span class="spinner" id="drawSpinner"></span>
          </button>
        </div>
      </div>

      <!-- Image Sub-panel -->
      <div class="image-panel" id="imagePanel">
        <div class="image-preview-wrap" id="imagePreviewWrap" style="display:none;">
          <img id="imagePreview" alt="Ảnh đã chọn" />
        </div>
        <div class="canvas-controls">
          <div style="display:flex; gap:6px; flex-wrap:wrap;">
            <button class="ghost-btn" id="chooseAlbumBtn" type="button">🖼️ Thư viện</button>
            <button class="ghost-btn" id="hideImagePanelBtn" type="button">Ẩn</button>
          </div>
          <button class="primary-pill-btn" id="translateImageBtn" type="button" disabled>
            <span>Dịch ảnh</span>
            <span class="spinner" id="imgSpinner"></span>
          </button>
        </div>
      </div>

      <!-- Input Footer -->
      <div class="input-footer">
        <div class="left-actions">
          <button class="chip-btn" id="pasteBtn" type="button">📋 Dán</button>
          <button class="ghost-btn" id="clearTextBtn" type="button" style="display:none;">Xóa chữ</button>
        </div>

        <button class="primary-pill-btn" id="translateTextBtn" type="button">
          <span>Dịch</span>
          <span class="spinner" id="textSpinner"></span>
        </button>
      </div>
    </section>

    <!-- Live Conversation Panel -->
    <section class="live-card" id="liveCard">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <strong style="font-size:14px;">Hội thoại trực tiếp hai chiều</strong>
        <div style="display:flex; gap:6px;">
          <button class="ghost-btn" id="clearLiveBtn" type="button">Xóa</button>
          <button class="ghost-btn" id="closeLiveBtn" type="button">Đóng</button>
        </div>
      </div>

      <div class="live-turn-row">
        <button class="turn-btn" id="liveLeftBtn" type="button">
          <span id="liveLeftTitle">Người A (Việt)</span>
          <small style="color:var(--text-muted);">Bấm nói / Dừng</small>
        </button>
        <button class="turn-btn" id="liveRightBtn" type="button">
          <span id="liveRightTitle">Người B (Trung)</span>
          <small style="color:var(--text-muted);">Bấm nói / Dừng</small>
        </button>
      </div>

      <div class="live-feed" id="liveFeed">
        <div style="margin:auto; text-align:center; font-size:13px; color:var(--text-muted);">
          Chọn ngôn ngữ hai bên rồi bấm nút Người A hoặc Người B để trò chuyện.
        </div>
      </div>
    </section>

    <!-- Result Card -->
    <section class="result-card" id="resultCard">
      <div class="result-header">
        <div>
          <div class="result-main-text" id="resTranslation"></div>
          <div class="phonetic-badge" id="resPhonetic" style="display:none;"></div>
        </div>
        <span style="font-size:12px; color:var(--text-muted);" id="resDetected"></span>
      </div>

      <div class="note-box" id="resNote" style="display:none;"></div>

      <div class="examples-box" id="resExamplesSection" style="display:none;">
        <div class="examples-title">3 Ví dụ cách dùng trong câu</div>
        <div id="resExamplesList" style="display:flex; flex-direction:column; gap:8px;"></div>
      </div>

      <div class="result-actions">
        <div style="display:flex; gap:8px;">
          <button class="ghost-btn" id="speakBtn" type="button">🔊 Nghe</button>
          <button class="ghost-btn" id="copyBtn" type="button">📋 Sao chép</button>
        </div>
      </div>
    </section>

    <!-- Hidden File Inputs -->
    <input type="file" id="albumInput" accept="image/*" hidden />
    <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden />

    <!-- Bottom Language + Dock Controls -->
    <footer class="bottom-dock">
      <div class="lang-row">
        <select id="sourceLang" class="lang-pill" aria-label="Ngôn ngữ nguồn">
          <option value="auto">Tự động</option>
          <option value="Tiếng Việt">Việt</option>
          <option value="Tiếng Anh">Anh</option>
          <option value="Tiếng Trung (Giản thể)">Trung (Giản)</option>
          <option value="Tiếng Trung (Phồn thể)">Trung (Phồn)</option>
          <option value="Tiếng Nhật">Nhật</option>
          <option value="Tiếng Hàn">Hàn</option>
          <option value="Tiếng Pháp">Pháp</option>
          <option value="Tiếng Đức">Đức</option>
          <option value="Tiếng Tây Ban Nha">Tây Ban Nha</option>
          <option value="Tiếng Thái">Thái</option>
        </select>

        <button class="swap-icon-btn" id="swapLangBtn" type="button" title="Đảo chiều ngôn ngữ">⇄</button>

        <select id="targetLang" class="lang-pill" aria-label="Ngôn ngữ đích">
          <option value="Tiếng Trung (Giản thể)" selected>Trung (Giản)</option>
          <option value="Tiếng Việt">Việt</option>
          <option value="Tiếng Anh">Anh</option>
          <option value="Tiếng Trung (Phồn thể)">Trung (Phồn)</option>
          <option value="Tiếng Nhật">Nhật</option>
          <option value="Tiếng Hàn">Hàn</option>
          <option value="Tiếng Pháp">Pháp</option>
          <option value="Tiếng Đức">Đức</option>
          <option value="Tiếng Tây Ban Nha">Tây Ban Nha</option>
          <option value="Tiếng Thái">Thái</option>
        </select>
      </div>

      <div class="action-dock">
        <button class="dock-side" id="liveToggleBtn" type="button">
          <span class="dock-small-circle">👥</span>
          <span class="dock-label">Dịch trực tiếp</span>
        </button>

        <button class="mic-fab" id="micBtn" type="button" title="Dịch giọng nói">
          🎙️
        </button>

        <button class="dock-side" id="cameraBtn" type="button">
          <span class="dock-small-circle">📷</span>
          <span class="dock-label">Máy ảnh</span>
        </button>
      </div>
    </footer>
  </div>

  <!-- Settings Modal -->
  <div class="modal-backdrop" id="settingsModal">
    <div class="modal-card">
      <h3>Cấu hình Gemini API</h3>
      <p>
        API Key lưu cục bộ trên trình duyệt của bạn (<code>localStorage</code>). Tạo key tại
        <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a>.
      </p>
      <div class="field">
        <label for="apiKeyInput">Gemini API Key</label>
        <input type="password" id="apiKeyInput" placeholder="AIzaSy..." autocomplete="off" />
      </div>
      <div class="field">
        <label for="modelSelect">Chọn Model</label>
        <select id="modelSelect">
          <option value="gemini-2.5-flash" selected>gemini-2.5-flash (Ổn định, khuyên dùng)</option>
          <option value="gemini-2.5-flash-lite">gemini-2.5-flash-lite (Nhanh, tiết kiệm)</option>
          <option value="gemini-3.8-flash">gemini-3.8-flash (Mới nhất)</option>
          <option value="gemini-2.5-pro">gemini-2.5-pro (Chất lượng cao nhất)</option>
          <option value="custom">Tùy chỉnh tên model...</option>
        </select>
      </div>
      <div class="field" id="customModelField" style="display:none;">
        <label for="customModelInput">Tên model tùy chỉnh</label>
        <input type="text" id="customModelInput" placeholder="Ví dụ: gemini-2.5-flash" />
      </div>
      <div class="modal-footer">
        <button class="ghost-btn" id="closeModalBtn" type="button">Đóng</button>
        <button class="primary-pill-btn" id="saveModalBtn" type="button">Lưu</button>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const KEY_STORAGE = 'ai_dich_gemini_key_v3';
      const MODEL_STORAGE = 'ai_dich_gemini_model_v3';
      const DEFAULT_MODEL = 'gemini-2.5-flash';

      const $ = (id) => document.getElementById(id);

      let imagePayload = null;
      let lastTranslatedText = '';
      let isRecordingMic = false;
      let micRecorder = null;
      let micChunks = [];

      let activeLiveSide = null;
      let liveRecorder = null;
      let liveChunks = [];

      // --- Helpers ---
      function showError(msg) {
        const box = $('errorBox');
        box.textContent = msg;
        box.style.display = 'block';
      }

      function clearError() {
        const box = $('errorBox');
        box.textContent = '';
        box.style.display = 'none';
      }

      function escapeHtml(str) {
        return String(str || '').replace(/[&<>"']/g, (ch) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[ch]));
      }

      function getActiveModel() {
        return localStorage.getItem(MODEL_STORAGE) || DEFAULT_MODEL;
      }

      function refreshKeyStatus() {
        const key = (localStorage.getItem(KEY_STORAGE) || '').trim();
        const ready = key.length > 10;
        $('keyDot').classList.toggle('ready', ready);
        $('statusPill').textContent = ready ? `Sẵn sàng • ${getActiveModel()}` : 'Chưa có API Key';
      }

      function syncLiveLabels() {
        const s = $('sourceLang').value === 'auto' ? 'Tiếng Việt' : $('sourceLang').value;
        const t = $('targetLang').value;
        $('liveLeftTitle').textContent = `Người A (${s})`;
        $('liveRightTitle').textContent = `Người B (${t})`;
      }

      // Lấy MIME type audio phù hợp với trình duyệt
      function getSupportedAudioMime() {
        const candidates = [
          'audio/webm;codecs=opus',
          'audio/webm',
          'audio/mp4;codecs=mp4a.40.2',
          'audio/mp4',
          'audio/ogg;codecs=opus'
        ];
        for (const m of candidates) {
          if (MediaRecorder.isTypeSupported(m)) return m;
        }
        return ''; // để trình duyệt tự chọn
      }

      refreshKeyStatus();
      syncLiveLabels();

      // --- Settings Modal ---
      $('modelSelect').addEventListener('change', () => {
        $('customModelField').style.display = $('modelSelect').value === 'custom' ? 'block' : 'none';
      });

      $('openKeyBtn').addEventListener('click', () => {
        const savedKey = localStorage.getItem(KEY_STORAGE) || '';
        const savedModel = getActiveModel();
        $('apiKeyInput').value = savedKey;
        const knownOptions = Array.from($('modelSelect').options).map(o => o.value);
        if (knownOptions.includes(savedModel) && savedModel !== 'custom') {
          $('modelSelect').value = savedModel;
          $('customModelField').style.display = 'none';
        } else {
          $('modelSelect').value = 'custom';
          $('customModelInput').value = savedModel;
          $('customModelField').style.display = 'block';
        }
        $('settingsModal').style.display = 'flex';
      });

      $('closeModalBtn').addEventListener('click', () => {
        $('settingsModal').style.display = 'none';
      });

      $('saveModalBtn').addEventListener('click', () => {
        const key = $('apiKeyInput').value.trim();
        if (!key) {
          showError('Vui lòng nhập Gemini API Key.');
          return;
        }
        let chosenModel = $('modelSelect').value;
        if (chosenModel === 'custom') {
          chosenModel = ($('customModelInput').value || '').trim() || DEFAULT_MODEL;
        }
        localStorage.setItem(KEY_STORAGE, key);
        localStorage.setItem(MODEL_STORAGE, chosenModel);
        $('settingsModal').style.display = 'none';
        clearError();
        refreshKeyStatus();
      });

      // --- Text & Paste & Clear ---
      $('sourceText').addEventListener('input', () => {
        $('clearTextBtn').style.display = $('sourceText').value.trim().length > 0 ? 'inline-flex' : 'none';
      });

      $('clearTextBtn').addEventListener('click', () => {
        $('sourceText').value = '';
        $('clearTextBtn').style.display = 'none';
      });

      $('pasteBtn').addEventListener('click', async () => {
        clearError();
        if (navigator.clipboard && navigator.clipboard.readText) {
          try {
            const clip = await navigator.clipboard.readText();
            if (clip) {
              $('sourceText').value = clip;
              $('clearTextBtn').style.display = 'inline-flex';
              $('sourceText').focus();
              return;
            }
          } catch (_) {}
        }
        $('sourceText').focus();
        showError('Trình duyệt chặn đọc clipboard tự động. Hãy bấm giữ vào ô nhập rồi chọn Dán.');
      });

      $('clearAllBtn').addEventListener('click', () => {
        $('sourceText').value = '';
        $('clearTextBtn').style.display = 'none';
        $('resultCard').style.display = 'none';
        strokes = [];
        redrawCanvas();
        imagePayload = null;
        $('imagePreview').removeAttribute('src');
        $('imagePreviewWrap').style.display = 'none';
        $('translateImageBtn').disabled = true;
        clearError();
      });

      // --- Language Swap ---
      $('swapLangBtn').addEventListener('click', () => {
        const src = $('sourceLang');
        const tgt = $('targetLang');
        if (src.value === 'auto') {
          src.value = tgt.value;
          tgt.value = 'Tiếng Việt';
        } else {
          const temp = src.value;
          src.value = tgt.value;
          tgt.value = temp;
        }
        syncLiveLabels();
      });

      $('sourceLang').addEventListener('change', syncLiveLabels);
      $('targetLang').addEventListener('change', syncLiveLabels);

      // --- Canvas Drawing ---
      const canvas = $('drawCanvas');
      const ctx = canvas.getContext('2d');
      let isDrawing = false;
      let strokes = [];
      let currentStroke = null;

      function resizeCanvas() {
        const stage = canvas.parentElement;
        if (!stage || stage.clientWidth === 0) return;
        canvas.width = stage.clientWidth;
        canvas.height = stage.clientHeight;
        redrawCanvas();
      }

      function redrawCanvas() {
        ctx.fillStyle = '#111213';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#ffffff';
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        for (const stroke of strokes) {
          if (!stroke.points || stroke.points.length === 0) continue;
          ctx.lineWidth = stroke.size;
          ctx.beginPath();
          ctx.moveTo(stroke.points[0].x, stroke.points[0].y);
          for (let i = 1; i < stroke.points.length; i++) {
            ctx.lineTo(stroke.points[i].x, stroke.points[i].y);
          }
          ctx.stroke();
        }
      }

      function getCanvasPoint(e) {
        const rect = canvas.getBoundingClientRect();
        const pt = e.touches && e.touches[0] ? e.touches[0] : e;
        return {
          x: pt.clientX - rect.left,
          y: pt.clientY - rect.top
        };
      }

      function onDrawStart(e) {
        e.preventDefault();
        isDrawing = true;
        currentStroke = {
          size: Number($('brushSize').value) || 6,
          points: [getCanvasPoint(e)]
        };
        strokes.push(currentStroke);
        redrawCanvas();
      }

      function onDrawMove(e) {
        if (!isDrawing || !currentStroke) return;
        e.preventDefault();
        currentStroke.points.push(getCanvasPoint(e));
        redrawCanvas();
      }

      function onDrawEnd() {
        isDrawing = false;
        currentStroke = null;
      }

      canvas.addEventListener('mousedown', onDrawStart);
      canvas.addEventListener('mousemove', onDrawMove);
      window.addEventListener('mouseup', onDrawEnd);
      canvas.addEventListener('touchstart', onDrawStart, { passive: false });
      canvas.addEventListener('touchmove', onDrawMove, { passive: false });
      canvas.addEventListener('touchend', onDrawEnd);
      window.addEventListener('resize', () => {
        if ($('canvasPanel').style.display === 'flex') resizeCanvas();
      });

      $('toggleDrawBtn').addEventListener('click', () => {
        const panel = $('canvasPanel');
        const opening = panel.style.display !== 'flex';
        panel.style.display = opening ? 'flex' : 'none';
        $('toggleDrawBtn').classList.toggle('active', opening);
        if (opening) {
          $('imagePanel').style.display = 'none';
          resizeCanvas();
        }
      });

      $('undoDrawBtn').addEventListener('click', () => {
        strokes.pop();
        redrawCanvas();
      });

      $('clearDrawBtn').addEventListener('click', () => {
        strokes = [];
        redrawCanvas();
      });

      // --- Image / Camera ---
      $('cameraBtn').addEventListener('click', () => {
        $('imagePanel').style.display = 'flex';
        $('canvasPanel').style.display = 'none';
        $('toggleDrawBtn').classList.remove('active');
        $('cameraInput').click();
      });

      $('chooseAlbumBtn').addEventListener('click', () => {
        $('albumInput').click();
      });

      $('hideImagePanelBtn').addEventListener('click', () => {
        $('imagePanel').style.display = 'none';
      });

      $('albumInput').addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) handleImageFile(e.target.files[0]);
      });

      $('cameraInput').addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) handleImageFile(e.target.files[0]);
      });

      function handleImageFile(file) {
        clearError();
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const maxSide = 1280;
            let w = img.width;
            let h = img.height;
            if (w > maxSide || h > maxSide) {
              if (w >= h) {
                h = Math.round((h * maxSide) / w);
                w = maxSide;
              } else {
                w = Math.round((w * maxSide) / h);
                h = maxSide;
              }
            }
            const off = document.createElement('canvas');
            off.width = w;
            off.height = h;
            off.getContext('2d').drawImage(img, 0, 0, w, h);
            const dataUrl = off.toDataURL('image/jpeg', 0.85);
            imagePayload = {
              mimeType: 'image/jpeg',
              data: dataUrl.split(',')[1]
            };
            $('imagePreview').src = dataUrl;
            $('imagePreviewWrap').style.display = 'flex';
            $('imagePanel').style.display = 'flex';
            $('translateImageBtn').disabled = false;
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      }

      // --- Gemini API Call với prompt nâng cao ---
      function buildTranslationPrompt(srcLang, tgtLang, instruction) {
        return `Bạn là một dịch giả chuyên nghiệp đa ngôn ngữ với hơn 20 năm kinh nghiệm, am hiểu sâu sắc về ngữ pháp, thành ngữ, sắc thái văn hóa và phong cách diễn đạt của nhiều ngôn ngữ.

**QUY TẮC DỊCH THUẬT:**
1. Dịch tự nhiên, trôi chảy như người bản xứ, không dịch word-by-word.
2. Giữ nguyên ý nghĩa, sắc thái, giọng điệu và phong cách của bản gốc.
3. Với thành ngữ, tục ngữ: tìm cách diễn đạt tương đương trong ngôn ngữ đích thay vì dịch literal.
4. Với thuật ngữ chuyên ngành: giữ nguyên nếu không có tương đương chính xác, hoặc dịch kèm giải thích.
5. Đảm bảo văn phong phù hợp: trang trọng/thân mật, kỹ thuật/đời thường, v.v.

**NGÔN NGỮ NGUỒN:** ${srcLang === 'auto' ? 'Tự động nhận diện' : srcLang}
**NGÔN NGỮ ĐÍCH:** ${tgtLang}

**YÊU CẦU CỤ THỂ:** ${instruction}

**ĐỊNH DẠNG ĐẦU RA (JSON hợp lệ, KHÔNG bọc markdown):**
{
  "detected_source": "Tên ngôn ngữ nguồn thực tế nhận diện được",
  "source_text": "Nội dung gốc (transcript nếu là audio/ảnh)",
  "translation": "Bản dịch chất lượng cao sang ${tgtLang}",
  "phonetic": "Phiên âm cách đọc bản dịch. BẮT BUỘC có Pinyin có dấu nếu đích là tiếng Trung, Romaji nếu đích là tiếng Nhật, IPA nếu đích là tiếng Anh/Pháp/Đức/Tây Ban Nha, hoặc chuỗi rỗng nếu đích là tiếng Việt/Hàn/Thái",
  "note": "Chú thích ngắn gọn bằng tiếng Việt về sắc thái, từ loại, cách dùng tự nhiên, hoặc lưu ý văn hóa (nếu có)",
  "examples": [
    {
      "sentence": "Câu ví dụ 1 bằng ${tgtLang} thể hiện cách dùng tự nhiên",
      "phonetic": "Phiên âm của câu ví dụ 1 (theo quy tắc trên)",
      "meaning_vi": "Nghĩa tiếng Việt của câu ví dụ 1"
    },
    {
      "sentence": "Câu ví dụ 2 bằng ${tgtLang}",
      "phonetic": "Phiên âm của câu ví dụ 2",
      "meaning_vi": "Nghĩa tiếng Việt của câu ví dụ 2"
    },
    {
      "sentence": "Câu ví dụ 3 bằng ${tgtLang}",
      "phonetic": "Phiên âm của câu ví dụ 3",
      "meaning_vi": "Nghĩa tiếng Việt của câu ví dụ 3"
    }
  ]
}`;
      }

      const RESPONSE_SCHEMA = {
        type: 'object',
        properties: {
          detected_source: { type: 'string' },
          source_text: { type: 'string' },
          translation: { type: 'string' },
          phonetic: { type: 'string' },
          note: { type: 'string' },
          examples: {
            type: 'array',
            items: {
              type: 'object',
              properties: {
                sentence: { type: 'string' },
                phonetic: { type: 'string' },
                meaning_vi: { type: 'string' }
              },
              required: ['sentence', 'meaning_vi']
            }
          }
        },
        required: ['translation']
      };

      async function requestGemini({ prompt, inlineData = null }) {
        const apiKey = (localStorage.getItem(KEY_STORAGE) || '').trim();
        if (!apiKey) {
          $('openKeyBtn').click();
          throw new Error('Bạn chưa cấu hình Gemini API Key.');
        }

        const model = getActiveModel();
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`;

        const parts = [{ text: prompt }];
        if (inlineData) {
          parts.push({
            inlineData: {          // camelCase cho REST API
              mimeType: inlineData.mimeType,
              data: inlineData.data
            }
          });
        }

        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ role: 'user', parts }],
            generationConfig: {
              temperature: 0.2,
              responseMimeType: 'application/json',
              responseSchema: RESPONSE_SCHEMA
            }
          })
        });

        const data = await response.json();
        if (!response.ok) {
          const message = data?.error?.message || `Lỗi API (${response.status})`;
          throw new Error(message);
        }

        const raw = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
        if (!raw) {
          throw new Error('Không nhận được nội dung phản hồi từ model.');
        }

        try {
          return JSON.parse(raw);
        } catch (_) {
          const stripped = raw.replace(/^```json\s*/i, '').replace(/```$/i, '').trim();
          return JSON.parse(stripped);
        }
      }

      function renderTranslationResult(res) {
        lastTranslatedText = res.translation || '';
        $('resTranslation').textContent = lastTranslatedText;
        $('resDetected').textContent = res.detected_source ? `Nguồn: ${res.detected_source}` : '';

        if (res.phonetic && res.phonetic.trim()) {
          $('resPhonetic').textContent = res.phonetic.trim();
          $('resPhonetic').style.display = 'inline-block';
        } else {
          $('resPhonetic').style.display = 'none';
        }

        if (res.note && res.note.trim()) {
          $('resNote').innerHTML = `<strong>Chú thích:</strong> ${escapeHtml(res.note.trim())}`;
          $('resNote').style.display = 'block';
        } else {
          $('resNote').style.display = 'none';
        }

        const examples = Array.isArray(res.examples) ? res.examples.slice(0, 3) : [];
        if (examples.length > 0) {
          $('resExamplesList').innerHTML = examples.map((ex, i) => `
            <div class="example-card">
              <div class="ex-sentence">${i + 1}. ${escapeHtml(ex.sentence || '')}</div>
              ${ex.phonetic ? `<div class="ex-phonetic">${escapeHtml(ex.phonetic)}</div>` : ''}
              <div class="ex-meaning">${escapeHtml(ex.meaning_vi || '')}</div>
            </div>
          `).join('');
          $('resExamplesSection').style.display = 'flex';
        } else {
          $('resExamplesSection').style.display = 'none';
        }

        $('resultCard').style.display = 'flex';
      }

      function setBtnBusy(btnId, spinnerId, busy) {
        $(btnId).disabled = busy;
        $(spinnerId).style.display = busy ? 'inline-block' : 'none';
      }

      // --- Translate Actions ---
      $('translateTextBtn').addEventListener('click', async () => {
        const text = $('sourceText').value.trim();
        if (!text) {
          showError('Nhập nội dung cần dịch trước nhé.');
          return;
        }
        clearError();
        setBtnBusy('translateTextBtn', 'textSpinner', true);
        try {
          const prompt = buildTranslationPrompt(
            $('sourceLang').value,
            $('targetLang').value,
            `Dịch chính xác và tự nhiên nội dung sau: "${text}"`
          );
          const res = await requestGemini({ prompt });
          renderTranslationResult(res);
        } catch (err) {
          showError(err.message);
        } finally {
          setBtnBusy('translateTextBtn', 'textSpinner', false);
        }
      });

      $('translateDrawBtn').addEventListener('click', async () => {
        if (strokes.length === 0) {
          showError('Bạn chưa vẽ nét chữ hoặc ký hiệu nào.');
          return;
        }
        clearError();
        setBtnBusy('translateDrawBtn', 'drawSpinner', true);
        try {
          // Dùng PNG để giữ nét vẽ sắc nét
          const dataUrl = canvas.toDataURL('image/png');
          const prompt = buildTranslationPrompt(
            $('sourceLang').value,
            $('targetLang').value,
            'Nhận diện chính xác chữ viết tay, ký tự hoặc hình vẽ trên bảng vẽ, sau đó dịch sang ngôn ngữ đích.'
          );
          const res = await requestGemini({
            prompt,
            inlineData: { mimeType: 'image/png', data: dataUrl.split(',')[1] }
          });
          if (res.source_text) {
            $('sourceText').value = res.source_text;
            $('clearTextBtn').style.display = 'inline-flex';
          }
          renderTranslationResult(res);
        } catch (err) {
          showError(err.message);
        } finally {
          setBtnBusy('translateDrawBtn', 'drawSpinner', false);
        }
      });

      $('translateImageBtn').addEventListener('click', async () => {
        if (!imagePayload) {
          showError('Vui lòng chọn hoặc chụp ảnh trước.');
          return;
        }
        clearError();
        setBtnBusy('translateImageBtn', 'imgSpinner', true);
        try {
          const prompt = buildTranslationPrompt(
            $('sourceLang').value,
            $('targetLang').value,
            'Đọc và nhận diện chính xác toàn bộ văn bản trong hình ảnh (nếu có), sau đó dịch sang ngôn ngữ đích. Nếu ảnh không chứa văn bản, hãy mô tả nội dung chính và dịch mô tả đó.'
          );
          const res = await requestGemini({ prompt, inlineData: imagePayload });
          renderTranslationResult(res);
        } catch (err) {
          showError(err.message);
        } finally {
          setBtnBusy('translateImageBtn', 'imgSpinner', false);
        }
      });

      // --- Voice Translation (Mic FAB) ---
      $('micBtn').addEventListener('click', async () => {
        if (isRecordingMic && micRecorder) {
          micRecorder.stop();
          return;
        }
        clearError();

        const mimeType = getSupportedAudioMime();
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          micChunks = [];
          micRecorder = mimeType
            ? new MediaRecorder(stream, { mimeType })
            : new MediaRecorder(stream);

          micRecorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) micChunks.push(e.data);
          };

          micRecorder.onstop = async () => {
            isRecordingMic = false;
            $('micBtn').classList.remove('recording');
            stream.getTracks().forEach((t) => t.stop());

            const blob = new Blob(micChunks, { type: micRecorder.mimeType || mimeType || 'audio/webm' });

            // Guard: audio quá ngắn
            if (!blob || blob.size < 1000) {
              showError('Đoạn ghi âm quá ngắn hoặc không có âm thanh. Vui lòng thử lại.');
              refreshKeyStatus();
              return;
            }

            const base64 = await blobToBase64(blob);
            $('statusPill').textContent = 'Đang dịch giọng nói...';
            try {
              const prompt = buildTranslationPrompt(
                $('sourceLang').value,
                $('targetLang').value,
                'Nghe và chép lại chính xác câu nói trong đoạn ghi âm, sau đó dịch sang ngôn ngữ đích một cách tự nhiên nhất.'
              );
              const res = await requestGemini({
                prompt,
                inlineData: { mimeType: blob.type || 'audio/webm', data: base64 }
              });
              if (res.source_text) {
                $('sourceText').value = res.source_text;
                $('clearTextBtn').style.display = 'inline-flex';
              }
              renderTranslationResult(res);
              speak(res.translation, $('targetLang').value);
            } catch (err) {
              showError(err.message);
            } finally {
              refreshKeyStatus();
            }
          };

          micRecorder.start();
          isRecordingMic = true;
          $('micBtn').classList.add('recording');
          $('statusPill').textContent = 'Đang nghe... bấm mic để dừng';
        } catch (_) {
          showError('Không thể mở micro. Hãy kiểm tra quyền truy cập micro của trình duyệt.');
        }
      });

      // --- Live Conversation ---
      $('liveToggleBtn').addEventListener('click', () => {
        const card = $('liveCard');
        const opening = card.style.display !== 'flex';
        card.style.display = opening ? 'flex' : 'none';
        $('liveToggleBtn').classList.toggle('active', opening);
        syncLiveLabels();
      });

      $('closeLiveBtn').addEventListener('click', () => {
        $('liveCard').style.display = 'none';
        $('liveToggleBtn').classList.remove('active');
      });

      $('clearLiveBtn').addEventListener('click', () => {
        $('liveFeed').innerHTML = '';
      });

      $('liveLeftBtn').addEventListener('click', () => toggleLiveTurn('left'));
      $('liveRightBtn').addEventListener('click', () => toggleLiveTurn('right'));

      async function toggleLiveTurn(side) {
        // Nếu đang ghi âm
        if (activeLiveSide) {
          // Bấm lại đúng bên đang ghi → dừng
          if (activeLiveSide === side) {
            if (liveRecorder && liveRecorder.state === 'recording') liveRecorder.stop();
          }
          return; // Bấm bên kia → bỏ qua
        }
        clearError();

        const baseSrc = $('sourceLang').value === 'auto' ? 'Tiếng Việt' : $('sourceLang').value;
        const baseTgt = $('targetLang').value;
        const speakLang = side === 'left' ? baseSrc : baseTgt;
        const outLang = side === 'left' ? baseTgt : baseSrc;
        const btn = side === 'left' ? $('liveLeftBtn') : $('liveRightBtn');

        const mimeType = getSupportedAudioMime();
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          liveChunks = [];
          liveRecorder = mimeType
            ? new MediaRecorder(stream, { mimeType })
            : new MediaRecorder(stream);

          liveRecorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) liveChunks.push(e.data);
          };

          liveRecorder.onstop = async () => {
            activeLiveSide = null;
            btn.classList.remove('active');
            stream.getTracks().forEach((t) => t.stop());

            const blob = new Blob(liveChunks, { type: liveRecorder.mimeType || mimeType || 'audio/webm' });
            if (!blob || blob.size < 800) {
              showError('Đoạn ghi âm quá ngắn. Vui lòng nói rõ hơn.');
              return;
            }

            const base64 = await blobToBase64(blob);
            const bubble = addBubble(side, 'Đang dịch...', '');

            try {
              const prompt = `Bạn là phiên dịch viên chuyên nghiệp. Nghe câu nói bằng ${speakLang} và dịch tự nhiên sang ${outLang}.
Chỉ trả về JSON hợp lệ: {"source":"câu gốc","translated":"bản dịch","phonetic":"phiên âm nếu có (Pinyin cho tiếng Trung, Romaji cho tiếng Nhật, IPA cho tiếng Anh/Pháp/Đức/Tây Ban Nha, hoặc rỗng)"}`;
              const res = await requestGemini({
                prompt,
                inlineData: { mimeType: blob.type || 'audio/webm', data: base64 }
              });
              bubble.innerHTML = `
                <div><strong>${escapeHtml(res.translated || '')}</strong></div>
                ${res.phonetic ? `<div class="ex-phonetic">${escapeHtml(res.phonetic)}</div>` : ''}
                ${res.source ? `<div class="bubble-sub">${escapeHtml(res.source)}</div>` : ''}
              `;
              speak(res.translated, outLang);
            } catch (err) {
              bubble.remove();
              showError(err.message);
            }
          };

          liveRecorder.start();
          activeLiveSide = side;
          btn.classList.add('active');
        } catch (_) {
          showError('Không thể truy cập micro cho chế độ hội thoại trực tiếp.');
        }
      }

      function addBubble(side, mainText, subText) {
        const feed = $('liveFeed');
        if (feed.children.length === 1 && feed.children[0].style.margin === 'auto') {
          feed.innerHTML = '';
        }
        const div = document.createElement('div');
        div.className = `bubble ${side === 'left' ? 'bubble-a' : 'bubble-b'}`;
        div.innerHTML = `<div>${escapeHtml(mainText)}</div>${subText ? `<div class="bubble-sub">${escapeHtml(subText)}</div>` : ''}`;
        feed.appendChild(div);
        feed.scrollTop = feed.scrollHeight;
        return div;
      }

      // --- TTS & Copy ---
      const voiceLangMap = {
        'Tiếng Việt': 'vi-VN',
        'Tiếng Anh': 'en-US',
        'Tiếng Trung (Giản thể)': 'zh-CN',
        'Tiếng Trung (Phồn thể)': 'zh-TW',
        'Tiếng Nhật': 'ja-JP',
        'Tiếng Hàn': 'ko-KR',
        'Tiếng Pháp': 'fr-FR',
        'Tiếng Đức': 'de-DE',
        'Tiếng Tây Ban Nha': 'es-ES',
        'Tiếng Thái': 'th-TH'
      };

      function speak(text, langLabel) {
        if (!text || !('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = voiceLangMap[langLabel] || 'en-US';
        window.speechSynthesis.speak(utter);
      }

      $('speakBtn').addEventListener('click', () => {
        speak(lastTranslatedText, $('targetLang').value);
      });

      $('copyBtn').addEventListener('click', async () => {
        if (!lastTranslatedText) return;
        try {
          await navigator.clipboard.writeText(lastTranslatedText);
          $('copyBtn').textContent = '✓ Đã chép';
          setTimeout(() => { $('copyBtn').textContent = '📋 Sao chép'; }, 1400);
        } catch (_) {
          showError('Không thể sao chép tự động trên trình duyệt này.');
        }
      });

      function blobToBase64(blob) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onloadend = () => resolve(String(reader.result || '').split(',')[1] || '');
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
      }
    })();
  </script>
</body>
</html>
